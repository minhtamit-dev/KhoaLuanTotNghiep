# Vision Transformer ViT-B/16 Configuration
model:
  name: "vit_b16"
  architecture: "transformer"
  backbone: "vit_base_patch16_224"
  pretrained: true
  num_classes: 2
  in_channels: 3
  dropout_rate: 0.2
  image_size: 224
  patch_size: 16

training:
  epochs: 30
  batch_size: 16
  image_size: 224
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_epochs: 3
  
  optimizer:
    name: "adamw"
    betas: [0.9, 0.999]
    eps: 0.00000001
  
  scheduler:
    name: "cosine_annealing_warmup"
    t_max: 30
    eta_min: 0.000001
    
  loss:
    name: "cross_entropy"
    label_smoothing: 0.05
    use_class_weights: true
    
  callbacks:
    early_stopping:
      patience: 7
      metric: "val_f1"
      mode: "max"
    checkpoint:
      save_best_only: true
      metric: "val_f1"
      mode: "max"
      dir: "models/vit_b16"
