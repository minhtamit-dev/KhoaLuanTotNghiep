# EfficientNet-B4 Model Configuration
model:
  name: "efficientnet_b4"
  architecture: "cnn"
  backbone: "efficientnet_b4"
  pretrained: true
  num_classes: 2
  in_channels: 3
  dropout_rate: 0.3
  target_layer_name: "features.8" # For Grad-CAM

training:
  epochs: 30
  batch_size: 16
  image_size: 380
  learning_rate: 0.0003
  weight_decay: 0.00001
  
  optimizer:
    name: "adamw"
    betas: [0.9, 0.999]
    eps: 0.00000001
  
  scheduler:
    name: "cosine_annealing"
    t_max: 30
    eta_min: 0.000001
    
  loss:
    name: "cross_entropy"
    label_smoothing: 0.05
    use_class_weights: true
    
  callbacks:
    early_stopping:
      patience: 7
      metric: "val_f1"
      mode: "max"
    checkpoint:
      save_best_only: true
      metric: "val_f1"
      mode: "max"
      dir: "models/efficientnet_b4"
